name: "[PUSH] Quickbuild"
on:
  push:
    branches-ignore:
      - main
concurrency:
  group: ci-${{ github.ref_name }}
jobs:
  staticCodeValidation:
    name: Validation jobs
    uses: navikt/sf-shared/.github/workflows/ciStaticCodeValidation.yml@cd2888f6ceb6bf169d430ad63d04865d40bf9ecd
    permissions:
      contents: read
      security-events: write

  checkChanges:
    name: Check changes
    needs: staticCodeValidation
    runs-on: ubuntu-latest
    outputs:
      hasSrcChanges: ${{ steps.checkChanges.outputs.hasSrcChanges }}
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: navikt/sf-shared/.github/actions/checkForPackageChanges@0972cd83b67f7566b033ba1e50ff2140a089ba0b
        id: checkChanges

  quickBuild:
    name: Quickbuild
    needs: checkChanges
    if: ${{ github.event_name == 'workflow_dispatch' || needs.checkChanges.outputs.hasSrcChanges == 'true' }}
    runs-on: ubuntu-latest
    container: ghcr.io/flxbl-io/sfp:${{ vars.SFP_CONTAINER_VERSION }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Authenticate DevHub
        uses: navikt/sf-shared/.github/actions/authenticateOrg@0972cd83b67f7566b033ba1e50ff2140a089ba0b
        with:
          auth-url: ${{ secrets.SF_DEVHUB_URL }}
          alias: "devhub"
          setDefaultDevhubUsername: "true"

      - name: "Quickbuild package"
        id: quickbuildPackage
        shell: bash
        run: |
          sfp quickbuild --devhubalias devhub --diffcheck --buildnumber ${GITHUB_RUN_ID} --branch ${GITHUB_REF#refs/heads/} --loglevel ${SFP_LOG_LEVEL}
        env:
          SFP_LOG_LEVEL: ${{ vars.SFP_LOG_LEVEL }}

      - name: Upload artifacts and logs
        if: always()
        uses: navikt/sf-shared/.github/actions/uploadWorkflowArtifactsAndLogs@4a55ce6da0e472e1cb9d7f76605096783865f981
        with:
          artifactName: "build-artifacts"
          uploadArtifacts: true
          logName: "build-logs"
          publishLogs: true
